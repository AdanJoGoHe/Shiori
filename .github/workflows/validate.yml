name: Exceptional validation
run-name: "Exceptional validation (${{ inputs.platform }}): ${{ inputs.reason || 'Release compatibility' }}"

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Exceptional reason (unreproduced regression, platform boundary, release)
        type: string
        required: true
      platform:
        description: Smallest platform set that answers the question
        type: choice
        options: [linux, windows, both]
        default: linux
        required: true
  workflow_call:
    inputs:
      platform:
        type: string
        default: linux

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    timeout-minutes: 15
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        os: ${{ fromJSON(inputs.platform == 'both' && '["ubuntu-24.04","windows-2025"]' || inputs.platform == 'windows' && '["windows-2025"]' || '["ubuntu-24.04"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.15'
          enable-cache: true
          cache-dependency-glob: uv.lock
          prune-cache: true
      - run: uv sync --locked --extra dev
      - run: uv run --locked python scripts/check-local.py
      - run: uv build
      - run: uv venv .release-env --python 3.12
      - name: Install wheel outside editable environment
        shell: bash
        run: |
          uv export --locked --no-dev --no-emit-project --no-hashes > release-constraints.txt
          uv pip install --python .release-env --constraint release-constraints.txt dist/*.whl
      - name: Verify packaged recovery and integration with synthetic data
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            .release-env/Scripts/python.exe scripts/verify-release.py
          else
            .release-env/bin/python scripts/verify-release.py
          fi
